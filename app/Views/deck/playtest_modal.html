<!-- リスト選択用汎用モーダル -->
<div id="ptListModal" class="pt-modal" onclick="ptCloseModalManual()">
    <div class="pt-modal-content" onclick="ptHideContextMenu(); event.stopPropagation()">
        <div class="pt-modal-header">
            <h3 id="ptModalTitle">カード選択</h3>
            <button class="pt-modal-close" onclick="ptCloseModalManual()">&times;</button>
        </div>
        <div class="pt-modal-body" id="ptModalBody"></div>
        <div class="pt-modal-footer" id="ptModalFooter"></div>
    </div>
</div>

<script>
// モーダル内のカード要素用：スマホ長押し判定ヘルパー
function setupModalItemTouchMenu(itemEl, onTrigger) {
    let timer = null;
    let moved = false;
    let startX = 0, startY = 0;

    itemEl.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) return;
        moved = false;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;

        timer = setTimeout(() => {
            if (!moved) {
                if (navigator.vibrate) navigator.vibrate(40);
                const mockEvent = {
                    clientX: startX,
                    clientY: startY,
                    preventDefault: () => {},
                    stopPropagation: () => {}
                };
                onTrigger(mockEvent);
                timer = null;
            }
        }, 500);
    }, { passive: true });

    itemEl.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        if (Math.hypot(touch.clientX - startX, touch.clientY - startY) > 8) {
            moved = true;
            if (timer) {
                clearTimeout(timer);
                timer = null;
            }
        }
    }, { passive: true });

    itemEl.addEventListener('touchend', () => {
        if (timer) {
            clearTimeout(timer);
            timer = null;
        }
    });

    itemEl.addEventListener('touchcancel', () => {
        if (timer) {
            clearTimeout(timer);
            timer = null;
        }
    });
}
// ==========================================
// モーダル共通制御
// ==========================================
function ptHideContextMenu() {
    const menu = document.getElementById('ptContextMenu');
    if (menu) menu.style.display = 'none';
}
function closePtModal() {
    ptHideContextMenu();
    document.getElementById('ptListModal').style.display = 'none';
}

function ptCloseModalManual() {
    ptHideContextMenu();
    let needRender = false;

    if (ptLookingCards && ptLookingCards.length > 0) {
        ptLookingCards.forEach(c => {
            c.faceDown = true;
            ptState.deck.push(c);
        });
        ptLookingCards = [];
        ptReturnOrder = [];
        needRender = true;
    }
    if (ptRevealedMatchedCards && ptRevealedMatchedCards.length > 0) {
        ptRevealedMatchedCards.forEach(c => {
            c.faceDown = true;
            ptState.deck.push(c);
        });
        ptRevealedMatchedCards = [];
        needRender = true;
    }
    if (ptRevealedUnmatchedCards && ptRevealedUnmatchedCards.length > 0) {
        ptRevealedUnmatchedCards.forEach(c => {
            c.faceDown = true;
            ptState.deck.push(c);
        });
        ptRevealedUnmatchedCards = [];
        needRender = true;
    }

    closePtModal();
    ptActiveRevealContext = null;

    if (needRender) {
        ptShuffle(ptState.deck);
        renderPtBoard();
    }
}

function handleGroupItemClick(itemEl, allIds) {
    ptHideContextMenu();
    const max = allIds.length;
    const currentSelectedIds = JSON.parse(itemEl.getAttribute('data-selected-ids') || '[]');
    const currentCount = currentSelectedIds.length;
    
    // 1クリックで1枚追加、最大枚数を超えたら選択解除(0)
    let nextCount = currentCount + 1;
    if (nextCount > max) nextCount = 0;

    if (nextCount > 0) {
        const selectedIds = allIds.slice(0, nextCount);
        itemEl.classList.add('selected');
        itemEl.setAttribute('data-selected-ids', JSON.stringify(selectedIds));
        updateItemSelectionBadge(itemEl, nextCount, max);
    } else {
        itemEl.classList.remove('selected');
        itemEl.removeAttribute('data-selected-ids');
        updateItemSelectionBadge(itemEl, 0, max);
    }
}

function updateItemSelectionBadge(itemEl, selectedCount, maxCount) {
    let selectBadge = itemEl.querySelector('.badge-selected-count');
    if (selectedCount > 0) {
        if (!selectBadge) {
            selectBadge = document.createElement('div');
            selectBadge.className = 'badge-selected-count';
            itemEl.appendChild(selectBadge);
        }
        selectBadge.innerText = `${selectedCount} / ${maxCount}枚`;
        selectBadge.style.display = 'flex';
    } else {
        if (selectBadge) selectBadge.style.display = 'none';
    }
}

function ptReturnToPreviousModal() {
    if (ptBatchMoveQueue && ptBatchMoveQueue.length > 0) {
        ptProcessNextBatchMove();
        return;
    }

    if (ptActiveRevealContext === 'revealed') {
        const hasMatched = ptRevealedMatchedCards && ptRevealedMatchedCards.length > 0;
        const hasUnmatched = ptRevealedUnmatchedCards && ptRevealedUnmatchedCards.length > 0;
        if (hasMatched || hasUnmatched) {
            renderRevealedUntilModal();
        } else {
            closePtModal();
            ptActiveRevealContext = null;
        }
    } else if (ptActiveRevealContext === 'looking') {
        if (ptLookingCards && ptLookingCards.length > 0) {
            renderLookingCardsModal();
        } else {
            closePtModal();
            ptActiveRevealContext = null;
        }
    } else {
        closePtModal();
        ptActiveRevealContext = null;
    }
}

// ==========================================
// 山札閲覧・一括操作モーダル
// ==========================================
function ptViewDeck() {
    ptActiveRevealContext = 'deck_view';
    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    title.innerText = "山札を見る";
    body.innerHTML = `
        <p style="margin-bottom:12px; font-size:13px; color:#aaa;">カードをクリックして選択（枚数指定可能）し、<b>右クリック</b>で移動先を指定できます。</p>
        <div class="pt-grid" id="ptDeckViewGrid"></div>
    `;

    const grid = document.getElementById('ptDeckViewGrid');
    const reversedDeck = [...ptState.deck].reverse();
    
    const groups = {};
    reversedDeck.forEach(card => {
        const key = getCardGroupKey(card);
        if (!groups[key]) groups[key] = { card: card, ids: [] };
        groups[key].ids.push(card.id);
    });

    Object.keys(groups).forEach(key => {
        const group = groups[key];
        const itemEl = document.createElement('div');
        itemEl.className = 'pt-grid-item';
        itemEl.innerHTML = `
            <img src="${group.card.src}">
            <div class="badge-count">${group.ids.length}</div>
            <div class="card-qty">${group.card.name}</div>
        `;
        itemEl.onclick = () => handleGroupItemClick(itemEl, group.ids);
        itemEl.oncontextmenu = (e) => {
            e.preventDefault(); e.stopPropagation();
            openDeckViewContextMenu(e, itemEl, group.ids);
        };
        setupModalItemTouchMenu(itemEl, (mockE) => openDeckViewContextMenu(mockE, itemEl, group.ids)); // ★ 追加
        grid.appendChild(itemEl);
    });
    footer.innerHTML = `
        <button class="btn-pt-secondary" onclick="closePtModal()">閉じる</button>
        <button class="btn-pt-secondary" onclick="ptBatchDeckAction('top')">山札の一番上に戻す</button>
        <button class="btn-pt-secondary" onclick="ptBatchDeckAction('bottom')">山札の一番下に置く</button>
        <button class="btn-pt-secondary" onclick="ptBatchDeckAction('shuffle_deck')">山札に加えてシャッフル</button>
    `;
    modal.style.display = 'flex';
}

function ptBatchMoveFromDeck(targetZone) {
    const items = document.querySelectorAll('#ptDeckViewGrid .pt-grid-item.selected');
    if (items.length === 0) { alert('カードを選択してください。'); return; }

    let allIds = [];
    items.forEach(item => {
        const ids = JSON.parse(item.getAttribute('data-selected-ids') || '[]');
        allIds = allIds.concat(ids);
    });

    let anyModalOpened = false;
    if (targetZone === 'shield_select') {
        const isFaceup = confirm("シールドに「表向き」で置きますか？\n(「キャンセル」で裏向きに置きます)");
        allIds.forEach(id => {
            const success = ptMoveCard(id, 'deck', 'shield', { faceDown: !isFaceup });
            if (!success) anyModalOpened = true;
        });
    } else {
        allIds.forEach(id => {
            const success = ptMoveCard(id, 'deck', targetZone);
            if (!success) anyModalOpened = true;
        });
    }
    if (!anyModalOpened) closePtModal();
    renderPtBoard();
}

function ptBatchDeckAction(action) {
    const items = document.querySelectorAll('#ptDeckViewGrid .pt-grid-item.selected');
    if (items.length === 0) { alert('カードを選択してください。'); return; }

    let selectedIds = [];
    items.forEach(item => {
        const ids = JSON.parse(item.getAttribute('data-selected-ids') || '[]');
        selectedIds = selectedIds.concat(ids);
    });

    let extracted = [];
    ptState.deck = ptState.deck.filter(c => {
        if (selectedIds.includes(c.id)) {
            extracted.push(c);
            return false;
        }
        return true;
    });

    if (action === 'top') {
        extracted.forEach(c => ptState.deck.push(c));
    } else if (action === 'bottom') {
        extracted.reverse().forEach(c => ptState.deck.unshift(c));
    } else if (action === 'shuffle_deck') {
        extracted.forEach(c => ptState.deck.push(c));
        ptShuffle(ptState.deck);
    }
    closePtModal();
    renderPtBoard();
}

function openGroupedViewer(titleText, cardArray, zoneKey) {
    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    title.innerText = `${titleText}一覧`;
    body.innerHTML = `
        <p style="margin-bottom:12px; font-size:13px; color:#aaa;">カードをクリックして選択（複数枚可能）し、<b>右クリック（または長押し）</b>で移動先を指定できます。</p>
        <div class="pt-grid" id="ptViewerGrid"></div>
    `;

    const grid = document.getElementById('ptViewerGrid');
    const groups = {};
    cardArray.forEach(c => {
        const key = getCardGroupKey(c);
        if (!groups[key]) groups[key] = { card: c, ids: [] };
        groups[key].ids.push(c.id);
    });

    Object.keys(groups).forEach(key => {
        const group = groups[key];
        const itemEl = document.createElement('div');
        itemEl.className = 'pt-grid-item';
        itemEl.innerHTML = `
            <img src="${group.card.src}">
            <div class="badge-count">${group.ids.length}</div>
            <div class="card-qty">${group.card.name}</div>
        `;
        itemEl.onclick = () => handleGroupItemClick(itemEl, group.ids);
        itemEl.oncontextmenu = (e) => {
            e.preventDefault(); e.stopPropagation();
            openGroupedViewerContextMenu(e, itemEl, group.ids, zoneKey);
        };
        setupModalItemTouchMenu(itemEl, (mockE) => openGroupedViewerContextMenu(mockE, itemEl, group.ids, zoneKey));
        grid.appendChild(itemEl);
    });

    footer.innerHTML = `
        <button class="btn-pt-secondary" onclick="closePtModal()">閉じる</button>
    `;
    modal.style.display = 'flex';
}

function ptBatchMoveFromViewer(fromZone, targetZone) {
    const selectedItems = document.querySelectorAll('#ptViewerGrid .pt-grid-item.selected');
    if (selectedItems.length === 0) { alert('カードを選択してください。'); return; }

    let allIds = [];
    selectedItems.forEach(item => {
        const ids = JSON.parse(item.getAttribute('data-selected-ids') || '[]');
        allIds = allIds.concat(ids);
    });

    let anyModalOpened = false;

    if (targetZone === 'deck') {
        const action = confirm("選択したカードを山札に加えて「シャッフル」しますか？\n(「キャンセル」でシャッフルして山札の『一番下』に置きます)");
        if (action) {
            allIds.forEach(id => ptMoveCard(id, fromZone, 'deck', {skipUnderCheck:true}));
            ptShuffle(ptState.deck);
        } else {
            allIds.forEach(id => ptMoveCard(id, fromZone, 'deck', {bottom:true, skipUnderCheck:true}));
            ptShuffle(ptState.deck);
        }
    } else {
        allIds.forEach(id => {
            if (targetZone === 'battle') {
                const card = ptState[fromZone].find(c => c.id === id);
                if (card) {
                    const charIds = card.characteristics_ids || [];
                    const isEvo = charIds.some(cid => [2, 9, 16].includes(cid));
                    const isAura = card.cardtype_ids && card.cardtype_ids.includes(8);
                    if (isEvo || isAura) {
                        anyModalOpened = true;
                        closePtModal(); 
                        ptCheckEvolutionAndPlay(id, fromZone);
                        return;
                    }
                }
            }
            const success = ptMoveCard(id, fromZone, targetZone, {skipUnderCheck:true});
            if (!success) anyModalOpened = true;
        });
    }

    if (!anyModalOpened) closePtModal();
    renderPtBoard();
}

function openEvoTargetSelector(cardId, fromZone, mode) {
    ptEvoSelectedIds = [];
    if (mode === 'deck_top') { openEvoDeckTopModal(cardId, fromZone); return; }
    if (mode === 'deck_top3') { openEvoDeckTop3Modal(cardId, fromZone); return; }

    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    title.innerText = "重ねる進化元カードの選択";
    body.innerHTML = `
        <p style="margin-bottom:12px; font-size:13px; color:#aaa;">重ねたいカードをクリックして「重ねる順番（1番目が一番下）」を指定してください。複数枚重ねられます。</p>
        <div class="pt-grid" id="ptEvoGrid"></div>
    `;

    const grid = document.getElementById('ptEvoGrid');
    let list = [];
    const targetCard = ptState[fromZone].find(c => c.id === cardId);
    let targetCardTypes = targetCard ? (targetCard.cardtype_ids || []).map(Number) : [];
    const targetCharIds = targetCard ? (targetCard.characteristics_ids || []).map(Number) : [];
    if (targetCardTypes.length === 0) targetCardTypes.push(1);

    function isValidBattleEvoTarget(c) {
        if (c.id === cardId || c.faceDown) return false;
        const cTypes = (c.cardtype_ids || []).map(Number);
        const matchesTargetType = cTypes.some(id => targetCardTypes.includes(id));
        const isSpecialEvoType = cTypes.some(id => [3, 9, 10].includes(id));
        return (matchesTargetType || isSpecialEvoType);
    }

    if (mode === 'battle') {
        ptState.battle.forEach(c => { if (isValidBattleEvoTarget(c)) list.push({ card: c, zone: 'battle' }); });
    } else if (mode === 'mana') {
        ptState.mana.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'mana' }); });
    } else if (mode === 'graveyard') {
        ptState.graveyard.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'graveyard' }); });
    } else if (mode === 'shield') {
        ptState.shield.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'shield' }); });
    } else if (mode === 'hand') {
        ptState.hand.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'hand' }); });
    } else if (mode === 'multi') {
        ptState.graveyard.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'graveyard' }); });
        ptState.mana.forEach(c => { if (c.id !== cardId) list.push({ card: c, zone: 'mana' }); });
        ptState.battle.forEach(c => { if (isValidBattleEvoTarget(c)) list.push({ card: c, zone: 'battle' }); });
    }

    list.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'pt-grid-item';
        itemEl.dataset.cardId = item.card.id;
        const displaySrc = item.card.faceDown ? '/images/card/backimage.webp' : item.card.src;
        const displayName = item.card.faceDown ? '（裏向きのカード）' : item.card.name;
        itemEl.innerHTML = `<img src="${displaySrc}"><div class="card-qty">${displayName} (${zoneJapaneseName(item.zone)})</div>`;
        itemEl.onclick = () => handleEvoSelectClick(itemEl, item.card.id);
        grid.appendChild(itemEl);
    });

    const canPlayWithoutStack = targetCharIds.some(id => [9, 16].includes(id));
    let footerHtml = `<button class="btn-pt-secondary" onclick="closePtModal()">キャンセル</button>`;
    if (canPlayWithoutStack) {
        footerHtml += `<button class="btn-pt-secondary" style="background:#fd7e14; color:white; border:none;" onclick="
            ptMoveCard('${cardId}', '${fromZone}', 'battle', {skipUnderCheck: true});
            const bCard = ptState.battle.find(c => c.id === '${cardId}');
            if (bCard) ptCheckShieldAddAbility(bCard);
            closePtModal();
        ">重ねずに単体で出す</button>`;
    }
    footerHtml += `<button class="btn-pt-primary" onclick="ptExecuteEvolutionPlay('${cardId}', '${fromZone}')">決定してバトルゾーンに出す</button>`;
    footer.innerHTML = footerHtml;
    modal.style.display = 'flex';
    updateEvoSelectUI();
}

function openShieldStackSelector(baseCardId, position) {
    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    title.innerText = (position === 'under' ? "シールドの下に重ねるカード選択" : "シールドの上に重ねるカード選択");
    body.innerHTML = `
        <p style="margin-bottom:12px; font-size:13px; color:#aaa;">重ねたいカードを複数選択できます。選んだカードが指定のシールドに重ねられます。</p>
        <div class="pt-grid" id="ptShieldStackGrid"></div>
    `;

    const grid = document.getElementById('ptShieldStackGrid');
    let list = [];

    ['hand', 'mana', 'battle', 'graveyard', 'psychic'].forEach(zone => {
        ptState[zone].forEach(c => {
            if (c.id !== baseCardId) {
                if (zone === 'battle' && c.underCards && c.underCards.length > 0) {
                    list.push({ card: c, zone: zone, parentId: c.id, index: 0 });
                    c.underCards.forEach((child, idx) => {
                        list.push({ card: child, zone: zone, parentId: c.id, index: idx + 1 });
                    });
                } else {
                    list.push({ card: c, zone: zone });
                }
            }
        });
    });

    list.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'pt-grid-item';
        itemEl.dataset.cardId = item.card.id;
        itemEl.dataset.zone = item.zone;
        if (item.parentId !== undefined) {
            itemEl.dataset.parentId = item.parentId;
            itemEl.dataset.componentIndex = item.index;
        }
        const displaySrc = item.card.faceDown ? '/images/card/backimage.webp' : item.card.src;
        const displayName = item.card.faceDown ? '（裏向きのカード）' : item.card.name;

        itemEl.innerHTML = `<img src="${displaySrc}"><div class="card-qty">${displayName} (${zoneJapaneseName(item.zone)})</div>`;
        itemEl.onclick = () => itemEl.classList.toggle('selected');
        grid.appendChild(itemEl);
    });

    footer.innerHTML = `
        <button class="btn-pt-secondary" onclick="closePtModal()">キャンセル</button>
        <button class="btn-pt-primary" onclick="ptExecuteShieldStack('${baseCardId}', '${position}', true)">裏向きで重ねる</button>
        <button class="btn-pt-primary" onclick="ptExecuteShieldStack('${baseCardId}', '${position}', false)">表向きで重ねる</button>
    `;
    modal.style.display = 'flex';
}

function ptExecuteBattleToBattleStack(sourceCardId, position) {
    const targetSelected = document.querySelector('#ptBattleTargetCandidatesGrid .pt-grid-item.selected');
    if (!targetSelected) {
        alert("重ねる先の対象カードを選択してください。");
        return;
    }
    const targetCardId = targetSelected.dataset.cardId;

    const sourceIdx = ptState.battle.findIndex(c => c.id === sourceCardId);
    if (sourceIdx === -1) return;
    const sourceCard = ptState.battle[sourceIdx];
    const allComponents = [sourceCard, ...(sourceCard.underCards || [])];

    let cardsToMove = [];
    if (allComponents.length > 1) {
        if (ptBattleStackSelectedIndices.length === 0) {
            alert("移動するカードを1枚以上選択してください。");
            return;
        }
        // 選択された順番通りに移動カードを構築
        ptBattleStackSelectedIndices.forEach(idx => {
            cardsToMove.push(allComponents[idx]);
        });

        // 移動元に残るカードの再構成
        const remainCards = allComponents.filter((_, idx) => !ptBattleStackSelectedIndices.includes(idx));
        ptState.battle.splice(sourceIdx, 1);
        if (remainCards.length > 0) {
            const newParent = remainCards[0];
            newParent.underCards = remainCards.slice(1);
            ptState.battle.splice(sourceIdx, 0, newParent);
        }
    } else {
        cardsToMove = [ptState.battle.splice(sourceIdx, 1)[0]];
    }

    const targetIdx = ptState.battle.findIndex(c => c.id === targetCardId);
    if (targetIdx === -1) return;
    const targetCard = ptState.battle[targetIdx];

    cardsToMove.forEach(c => {
        c.underCards = [];
        c.faceDown = false;
        c.tapped = targetCard.tapped;
        c.inverted = false;
        c.is_under_stacked = true;
    });

    if (position === 'under') {
        // 対象カードの下敷きの末尾に指定順に追加
        targetCard.underCards = targetCard.underCards || [];
        cardsToMove.forEach(c => targetCard.underCards.push(c));
    } else {
        // 対象カードの上に重ねる（選択順の末尾を新たな一番上のカードとする）
        const newTop = cardsToMove.pop();
        newTop.is_under_stacked = false;
        newTop.underCards = [...cardsToMove, targetCard, ...(targetCard.underCards || [])];
        targetCard.underCards = [];
        ptState.battle[targetIdx] = newTop;
    }

    closePtModal();
    renderPtBoard();
}
function ptExecuteStackUnderBattle(cardId, fromZone) {
    const selected = document.querySelector('#ptStackUnderBattleGrid .pt-grid-item.selected');
    if (!selected) { alert('対象カードを選択してください。'); return; }

    const targetBattleId = selected.dataset.cardId;
    let bCard = ptState.battle.find(c => c.id === targetBattleId);
    if (!bCard) return;

    let idx = ptState[fromZone].findIndex(c => c.id === cardId);
    if (idx === -1) return;

    let card = ptState[fromZone].splice(idx, 1)[0];
    card.faceDown = false;
    card.tapped = false;
    card.inverted = false;
    card.is_under_stacked = true;

    let childUnderCards = card.underCards || [];
    card.underCards = [];

    bCard.underCards.push(card);
    childUnderCards.forEach(cu => {
        cu.is_under_stacked = true;
        bCard.underCards.push(cu);
    });

    closePtModal();
    renderPtBoard();
}

    }

    const count = ptRevealedSelectedIds.length;
    const menu = document.getElementById('ptContextMenu');
    menu.innerHTML = `
        <li onclick="ptMoveRevealedCardsBatch('hand')">選択した ${count} 枚を手札に加える</li>
        <li onclick="ptMoveRevealedCardsBatch('mana')">選択した ${count} 枚をマナに置く</li>
        <li onclick="ptMoveRevealedCardsBatch('graveyard')">選択した ${count} 枚を墓地に置く</li>
        <li onclick="ptMoveRevealedCardsBatch('battle')">選択した ${count} 枚をバトルゾーンに置く</li>
        <li onclick="ptMoveRevealedCardsBatch('shield')">選択した ${count} 枚をシールドに置く</li>
        <li onclick="ptMoveRevealedCardsBatch('psychic')">選択した ${count} 枚を超次元に置く</li>
    `;
    menu.style.display = 'block';
    adjustMenuPosition(e, menu);
}
function ptMoveRevealedCardsBatch(targetZone) {
    ptHideContextMenu();
    let idsToMove = [...ptRevealedSelectedIds];
    if (idsToMove.length === 0) return;
    ptRevealedSelectedIds = [];

    if (targetZone === 'battle' || targetZone === 'shield') {
        ptBatchMoveQueue = idsToMove;
        ptBatchMoveTargetZone = targetZone;
        ptProcessNextBatchMove();
    } else {
        idsToMove.forEach(id => {
            let card = null;
            let mIdx = ptRevealedMatchedCards.findIndex(c => c.id === id);
            if (mIdx !== -1) {
                card = ptRevealedMatchedCards.splice(mIdx, 1)[0];
            } else {
                let uIdx = ptRevealedUnmatchedCards.findIndex(c => c.id === id);
                if (uIdx !== -1) {
                    card = ptRevealedUnmatchedCards.splice(uIdx, 1)[0];
                }
            }
            if (card) {
                ptState.deck.push(card);
                ptMoveCard(id, 'deck', targetZone);
            }
        });

        const hasMatched = ptRevealedMatchedCards && ptRevealedMatchedCards.length > 0;
        const hasUnmatched = ptRevealedUnmatchedCards && ptRevealedUnmatchedCards.length > 0;
        if (!hasMatched && !hasUnmatched) {
            closePtModal();
            ptActiveRevealContext = null;
        } else {
            renderRevealedUntilModal();
        }
        renderPtBoard();
    }
}
// ability_id: 184 用 超GR下敷き枚数選択モーダル
function openGrUnderCountModal(cardId, fromZone) {
    const card = findCardById(cardId);
    if (!card) return;

    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    const maxCount = Math.min(12, ptState.gr.length);

    title.innerText = "超GRから下に重ねる枚数の選択";
    body.innerHTML = `
        <div style="padding: 10px 0; text-align: center;">
            <img src="${card.src}" style="width: 120px; height: 168px; border-radius: 6px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
            <p style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">「${card.name}」</p>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">
                超GRの上から裏向きで下に重ねる枚数を選択してください。<br>
                （最大12枚 / 現在の超GR残り: ${ptState.gr.length}枚）
            </p>
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px;">
                <label style="font-size: 14px;">重ねる枚数：</label>
                <input type="number" id="ptGrUnderCountInput" min="0" max="${maxCount}" value="${maxCount > 0 ? 1 : 0}" 
                    style="width: 70px; padding: 6px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 16px; text-align: center;">
                <span style="font-size: 14px;">枚</span>
            </div>
        </div>
    `;

    footer.innerHTML = `
        <button class="btn-pt-secondary" onclick="closePtModal()">キャンセル</button>
        <button class="btn-pt-primary" onclick="
            const val = parseInt(document.getElementById('ptGrUnderCountInput').value, 10);
            if (isNaN(val) || val < 0 || val > 12) {
                alert('0から12までの数値を入力してください。');
                return;
            }
            ptExecuteGrUnderPlay('${cardId}', '${fromZone}', val);
        ">決定してバトルゾーンに出す</button>
    `;

    modal.style.display = 'flex';
}
</script>
