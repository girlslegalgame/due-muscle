/**
 * 配置オプションに則ってシールドゾーンへの移動を実行
 */
function ptExecuteShieldDrop(cardId, fromZone, placementType) {
    const card = ptState[fromZone].find(c => c.id === cardId);
    if (!card) return;

    const faceRadio = document.querySelector('input[name="ptShieldFace"]:checked');
    const isFaceDown = faceRadio ? (faceRadio.value === 'faceDown') : true;

    const bundleRadio = document.querySelector('input[name="ptShieldBundleMode"]:checked');
    const isScatter = bundleRadio ? (bundleRadio.value === 'scatter') : false;

    let cardIdx = ptState[fromZone].findIndex(c => c.id === cardId);
    if (cardIdx === -1) return;

    let targetCards = [];

    if (fromZone === 'battle' && card.underCards && card.underCards.length > 0) {
        if (isScatter) {
            let removedCard = ptState[fromZone].splice(cardIdx, 1)[0];
            targetCards.push(removedCard);
            removedCard.underCards.forEach(uc => targetCards.push(uc));
            removedCard.underCards = [];
        } else {
            targetCards.push(ptState[fromZone].splice(cardIdx, 1)[0]);
        }
    } else {
        targetCards.push(ptState[fromZone].splice(cardIdx, 1)[0]);
    }

    if (placementType === 'new') {
        targetCards.forEach(c => {
            if (ptCheckAndReturnSpecialCard(c, 'shield', { faceDown: isFaceDown })) return;
            c.faceDown = isFaceDown;
            c.tapped = false;
            c.inverted = false;
            if (isScatter) {
                c.underCards = [];
            } else {
                c.underCards.forEach(uc => uc.faceDown = isFaceDown);
            }
            ptState.shield.push(c);
        });
    } else if (placementType === 'stack') {
        if (!ptSelectedDropShieldTargetId) {
            alert("重ねる対象のシールドを選択してください。");
            return;
        }

        let baseCard = ptState.shield.find(c => c.id === ptSelectedDropShieldTargetId);
        if (baseCard) {
            targetCards.forEach(c => {
                if (ptCheckAndReturnSpecialCard(c, 'shield', { faceDown: isFaceDown })) return;
                c.faceDown = isFaceDown;
                c.tapped = false;
                c.inverted = false;

                if (isScatter) {
                    c.underCards = [];
                    c.underCards = [baseCard, baseCard.underCards];
                    baseCard.underCards = [];
                    
                    const baseIdx = ptState.shield.findIndex(sh => sh.id === baseCard.id);
                    if (baseIdx !== -1) {
                        ptState.shield[baseIdx] = c;
                        baseCard = c;
                    }
                } else {
                    c.underCards.forEach(uc => uc.faceDown = isFaceDown);
                    const originalUnderOfC = [c.underCards];
                    c.underCards = [originalUnderOfC, baseCard, baseCard.underCards];
                    baseCard.underCards = [];
                    
                    const baseIdx = ptState.shield.findIndex(sh => sh.id === baseCard.id);
                    if (baseIdx !== -1) {
                        ptState.shield[baseIdx] = c;
                        baseCard = c;
                    }
                }
            });
        }
    }

    ptSelectedDropShieldTargetId = null;
    closePtModal();
    renderPtBoard();

    // 【追加】捲りモーダルの表示復帰判定
    ptReturnToPreviousModal();
}

/**
 * 選択されたシールドカードの移動と、残されたシールドカードの再構成処理
 */
function ptExecuteShieldUnderCardSelectMove(parentId, toZone, opts = {}) {
    const selectedItems = document.querySelectorAll('#ptShieldUnderSelectGrid .pt-grid-item.selected');
    if (selectedItems.length === 0) {
        alert("移動するカードを1枚以上選択してください。");
        return;
    }

    const shieldIdx = ptState.shield.findIndex(c => c.id === parentId);
    if (shieldIdx === -1) {
        closePtModal();
        return;
    }

    const parentCard = ptState.shield[shieldIdx];
    const allComponents = [parentCard, parentCard.underCards];

    const toMoveIndexes = [];
    selectedItems.forEach(item => {
        toMoveIndexes.push(parseInt(item.dataset.componentIndex));
    });

    const moveCards = [];
    const remainCards = [];

    allComponents.forEach((card, idx) => {
        if (toMoveIndexes.includes(idx)) {
            moveCards.push(card);
        } else {
            remainCards.push(card);
        }
    });

    // 元の束をシールドゾーンから一旦削除
    ptState.shield.splice(shieldIdx, 1);

    // 残されたカードがある場合、新しい代表親にしてシールドを再編成
    if (remainCards.length > 0) {
        const newParent = remainCards[0];
        newParent.underCards = remainCards.slice(1);
        ptState.shield.splice(shieldIdx, 0, newParent);
    }

    // 選択されたカードを指定のゾーンへ移動
    moveCards.forEach(card => {
        // === 【修正】GR/サイキックカードの特別帰還チェック ===
        if (ptCheckAndReturnSpecialCard(card, toZone)) {
            return;
        }

        card.underCards = [];
        card.faceDown = false; // シールドゾーンを離れるため表向きにリセット
        card.tapped = false;
        card.inverted = false;

        const cardtypeIds = card.cardtype_ids || [];

        if (toZone === 'battle') {
            if (cardtypeIds.some(id => [6, 7, 8].includes(id))) {
                card.tapped = true;
            }
            ptState.battle.push(card);
        } else if (toZone === 'mana') {
            card.inverted = true;
            card.tapped = card.is_multicolor;
            ptState.mana.push(card);
        } else if (toZone === 'shield') {
            card.faceDown = (opts.faceDown !== undefined) ? opts.faceDown : true;
            ptState.shield.push(card);
        } else if (toZone === 'hand') {
            ptState.hand.push(card);
        } else if (toZone === 'graveyard') {
            ptState.graveyard.push(card);
        } else if (toZone === 'deck') {
            if (opts.bottom) {
                ptState.deck.unshift(card);
            } else {
                ptState.deck.push(card);
            }
        } else {
            ptState[toZone].push(card);
        }
    });

    closePtModal();
    renderPtBoard();
}

    if (auraIdx === -1) return;
    let aura = ptState[fromZone].splice(auraIdx, 1)[0];

    let targetGr = ptState.battle.find(c => c.id === targetGrId);

function ptCheckAndReturnSpecialCard(card, toZone, opts = {}) {
    if (toZone === 'battle' || toZone === 'gr' || toZone === 'psychic') {
        return false;
    }
    const hasGR = card.characteristics_ids && card.characteristics_ids.includes(10);
    const hasPsychic = card.characteristics_ids && card.characteristics_ids.some(id => [3, 6].includes(id));

    if (hasGR || hasPsychic) {
        // 重ねられていたオーラや封印、進化元などを切り離して救出
        if (card.underCards && card.underCards.length > 0) {
            const attachedCards = [card.underCards];
            card.underCards = []; // GRクリーチャー本体の下敷きからクリア

            // 切り離されたカード群を、本来の目的地(toZone)へ移動配置
            attachedCards.forEach(attached => {
                attached.underCards = [];
                attached.tapped = false;
                attached.inverted = false;

                if (toZone === 'shield') {
                    // === 【修正】親カードのシールド表示向き設定(表向き/裏向き)をオーラにも連動して適用 ===
                    attached.faceDown = (opts.faceDown !== undefined) ? opts.faceDown : true;
                    ptState.shield.push(attached);
                } else if (toZone === 'hand') {
                    attached.faceDown = false;
                    ptState.hand.push(attached);
                } else if (toZone === 'graveyard') {
                    attached.faceDown = false;
                    ptState.graveyard.push(attached);
                } else if (toZone === 'mana') {
                    attached.faceDown = false;
                    attached.inverted = true;
                    attached.tapped = attached.is_multicolor;
                    ptState.mana.push(attached);
                } else if (toZone === 'deck') {
                    attached.faceDown = true;
                    ptState.deck.push(attached);
                } else {
                    ptState[toZone].push(attached);
                }
            });
        }

        // GR/サイキック本体の帰還処理
        if (hasGR) {
            card.tapped = false; card.inverted = false; card.faceDown = false;
            ptState.gr.unshift(card);
            alert(`ルールにより、超GRクリーチャー「${card.name}」は超GRの一番下に戻されました。付随していたオーラ等は${zoneJapaneseName(toZone)}に移動しました。`);
        } else if (hasPsychic) {
            card.tapped = false; card.inverted = false; card.faceDown = false;
            ptState.psychic.push(card);
            alert(`ルールにより、サイキック・クリーチャー「${card.name}」は超次元に戻されました。付随していたオーラ等は${zoneJapaneseName(toZone)}に移動しました。`);
        }
        return true;
    }
    return false;
}

// 【新規追加】条件捲り機能関連処理
// =========================================================================
let ptRevealedMatchedCards = [];   // 条件に適合したカード
let ptRevealedUnmatchedCards = []; // 道中で捲れた適合外のカード

// 捲り処理の実行
function ptExecuteRevealUntil() {
    const qtyInput = document.getElementById('ptRevealTargetQty');
    const costInput = document.getElementById('ptRevealCost');
    const raceSelect = document.getElementById('ptRevealRace');
    const typeSelect = document.getElementById('ptRevealCardType');

    const targetQty = parseInt(qtyInput.value, 10) || 1;
    const searchCost = costInput.value !== '' ? parseInt(costInput.value, 10) : null;
    const searchRace = raceSelect.value !== '' ? parseInt(raceSelect.value, 10) : null;
    const searchType = typeSelect.value !== '' ? parseInt(typeSelect.value, 10) : null;

    ptRevealedMatchedCards = [];
    ptRevealedUnmatchedCards = [];

    let matchCount = 0;

    while (ptState.deck.length > 0 && matchCount < targetQty) {
        let card = ptState.deck.pop();
        card.faceDown = false; // 捲るため表向きにする

        let isMatch = true;

        if (searchCost !== null && card.cost !== searchCost) {
            isMatch = false;
        }
        if (searchRace !== null && (!card.race_ids || !card.race_ids.includes(searchRace))) {
            isMatch = false;
        }
        if (searchType !== null && (!card.cardtype_ids || !card.cardtype_ids.includes(searchType))) {
            isMatch = false;
        }

        if (isMatch) {
            matchCount++;
            ptRevealedMatchedCards.push(card);
        } else {
            ptRevealedUnmatchedCards.push(card);
        }
    }

    if (ptRevealedMatchedCards.length === 0 && ptRevealedUnmatchedCards.length === 0) {
        alert("山札にカードが存在しません。");
        return;
    }

    renderRevealedUntilModal();
}

// 適合カードを任意のゾーンへ直接配置
function ptMoveRevealedCardDirectly(cardId, targetZone) {
    const idx = ptRevealedMatchedCards.findIndex(c => c.id === cardId);
    if (idx === -1) return;

    let card = ptRevealedMatchedCards.splice(idx, 1)[0];
    ptState.deck.push(card); // 一時的に山札の上に戻す

    if (targetZone === 'shield') {
        ptOpenShieldDropSelectModal(cardId, 'deck');
        return;
    }
    if (targetZone === 'battle') {
        ptOpenBattlePlacementSelectModal(cardId, 'deck');
        return;
    }

    ptMoveCard(cardId, 'deck', targetZone);

    if (ptRevealedMatchedCards.length === 0 && ptRevealedUnmatchedCards.length === 0) {
        closePtModal();
    } else {
        renderRevealedUntilModal();
    }
}

// 適合外カードの一括操作
function ptHandleUnmatchedAction(action) {
    if (ptRevealedUnmatchedCards.length > 0) {
        if (action === 'graveyard') {
            ptRevealedUnmatchedCards.forEach(card => {
                card.faceDown = false;
                ptState.graveyard.push(card);
            });
        } else if (action === 'shuffle_all') {
            ptRevealedUnmatchedCards.forEach(card => {
                card.faceDown = true;
                ptState.deck.push(card);
            });
            ptShuffle(ptState.deck);
        } else if (action === 'shuffle_bottom') {
            ptShuffle(ptRevealedUnmatchedCards);
            ptRevealedUnmatchedCards.forEach(card => {
                card.faceDown = true;
                ptState.deck.unshift(card); // 山札の下に追加
            });
        }
        ptRevealedUnmatchedCards = [];
    }

    // 【修正】適合カードと適合外カードが「両方とも」完全になくなった時のみモーダルを閉じます
    const hasMatched = ptRevealedMatchedCards && ptRevealedMatchedCards.length > 0;
    const hasUnmatched = ptRevealedUnmatchedCards && ptRevealedUnmatchedCards.length > 0;

    if (!hasMatched && !hasUnmatched) {
        closePtModal();
        ptActiveRevealContext = null;
    } else {
        renderRevealedUntilModal();
    }
    renderPtBoard();
}

function ptSelectDropBattleTarget(element) {

    element.classList.add('selected');
    ptSelectedDropBattleTargetId = element.dataset.battleId;
    
    const buttons = ['btnPtBattleDropStackUnder', 'btnPtBattleDropStackOver', 'btnPtBattleDropSeal'];
    buttons.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    });
}
// バトルゾーン配置決定処理
function ptExecuteBattlePlacement(cardId, fromZone, placementType) {
    let cardIdx = ptState[fromZone].findIndex(c => c.id === cardId);
    if (cardIdx === -1) return;

    let card = ptState[fromZone][cardIdx]; // spliceする前に対象カードの参照を取得
    const cardtypeIds = card.cardtype_ids || [];
    const isAura = cardtypeIds.includes(8);

    // 【追加】対象がオレガ・オーラ(cardtype_id: 8)で、「単体配置」または「上に表向きに重ねる」場合
    if (isAura && (placementType === 'new' || placementType === 'stack_over_faceup')) {
        closePtModal();
        ptOpenAuraPlaySelector(cardId, fromZone);
        return;
    }

    // 通常のカード、または「下重ね」「裏向き重ね(封印)」の場合はこれまでの処理を継続
    card = ptState[fromZone].splice(cardIdx, 1)[0];

    if (placementType === 'new') {
        card.faceDown = false;
        card.tapped = false;
        card.inverted = false;
        
        const charIds = card.characteristics_ids || [];
        const isEvo = charIds.some(id => [2, 9, 13 ,16].includes(id));
        if (isEvo) {
            ptState[fromZone].push(card);
            ptCheckEvolutionAndPlay(cardId, fromZone);
            return;
        } else {
            ptState.battle.push(card);
        }
        } else if (placementType === 'stack_under') {
                let baseCard = ptState.battle.find(c => c.id === ptSelectedDropBattleTargetId);
                if (baseCard) {
                    card.faceDown = false;
                    card.tapped = false;
                    card.inverted = false;
                    card.is_under_stacked = true; // 下敷きフラグを付与(上重ね描画から除外する)
                    baseCard.underCards.push(card);
                }
            } else if (placementType === 'stack_over_faceup') {
        // 上に表向きで重ねる(進化)
        let baseCard = ptState.battle.find(c => c.id === ptSelectedDropBattleTargetId);
        const baseIdx = ptState.battle.findIndex(c => c.id === ptSelectedDropBattleTargetId);
        
        if (baseCard && baseIdx !== -1) {
            if (!baseCard.faceDown) {
                // 通常のクリーチャーの上に重ねる場合
                card.faceDown = false;
                card.tapped = baseCard.tapped;
                card.inverted = false;
                
                const prevUnders = baseCard.underCards || [];
                baseCard.underCards = [];
                card.underCards = [baseCard, ...prevUnders];
                
                ptState.battle[baseIdx] = card;
            } else {
                // 封印(裏向きカード)の下にあるクリーチャー本体の上に割り込み進化させる場合
                let allComps = [baseCard, ...(baseCard.underCards || [])];
                let faceupIdx = allComps.findIndex(c => !c.faceDown); // 最初の表向き本体を探す
                
                if (faceupIdx !== -1) {
                    let foundCard = allComps[faceupIdx];
                    
                    card.faceDown = false;
                    card.tapped = foundCard.tapped;
                    card.inverted = false;
                    
                    // 表向き本体とその下の進化元を新しいカードの下に格納
                    const remainComps = allComps.slice(faceupIdx);
                    card.underCards = [...remainComps];
                    
                    // 新しいカードの上に、元々の封印(裏向きカード群)を再配置
                    const seals = allComps.slice(0, faceupIdx);
                    let newParent = seals[0];
                    newParent.underCards = [...seals.slice(1), card];
                    
                    ptState.battle[baseIdx] = newParent;
                } else {
                    card.faceDown = false;
                    card.tapped = baseCard.tapped;
                    card.inverted = false;
                    const prevUnders = baseCard.underCards || [];
                    baseCard.underCards = [];
                    card.underCards = [baseCard, ...prevUnders];
                    ptState.battle[baseIdx] = card;
                }
            }
        }
    } else if (placementType === 'stack_over_facedown') {
        let baseCard = ptState.battle.find(c => c.id === ptSelectedDropBattleTargetId);
        const baseIdx = ptState.battle.findIndex(c => c.id === ptSelectedDropBattleTargetId);
        if (baseCard && baseIdx !== -1) {
            card.faceDown = true;
            card.tapped = baseCard.tapped;
            card.inverted = false;
            
            const prevUnders = baseCard.underCards || [];
            baseCard.underCards = [];
            card.underCards = [baseCard, ...prevUnders];
            
            ptState.battle[baseIdx] = card;
        }
    }

    ptSelectedDropBattleTargetId = null;
    closePtModal();
    renderPtBoard();

    ptReturnToPreviousModal();
}

// 一時的にデッキへ戻されていたカードを元の未配置配列に救出する内部関数
function ptRevertCardToTemporaryPool(cardId, fromZone) {
    if (fromZone === 'deck') {
        const cardIdx = ptState.deck.findIndex(c => c.id === cardId);
        if (cardIdx !== -1) {
            let card = ptState.deck.splice(cardIdx, 1)[0];
            
            // 起動元のコンテキストに合わせて正しい配列へ差し戻す
            if (ptActiveRevealContext === 'revealed') {
                ptRevealedMatchedCards.push(card);
            } else {
                ptLookingCards.push(card);
            }
        }
    }
}

function ptMoveLookingCardsBatch(targetZone) {
    ptHideContextMenu(); // ★ メニューを即座に閉じる
    ptActiveRevealContext = 'looking'; // ★ 閲覧コンテキストを明示
    let idsToMove = [...ptReturnOrder];
    
    if (idsToMove.length === 0 && ptLastRightClickedCardId) {
        idsToMove = [ptLastRightClickedCardId];
    }
    
    if (idsToMove.length === 0) return;

    // 選択管理バッファをクリア
    ptReturnOrder = [];
    ptLastRightClickedCardId = null;

    if (targetZone === 'battle' || targetZone === 'shield') {
        ptBatchMoveQueue = idsToMove;
        ptBatchMoveTargetZone = targetZone;
        ptProcessNextBatchMove();
    } else {
        idsToMove.forEach(id => {
            const idx = ptLookingCards.findIndex(c => c.id === id);
            if (idx !== -1) {
                let card = ptLookingCards.splice(idx, 1)[0];
                ptState.deck.push(card);
                ptMoveCard(id, 'deck', targetZone);
            }
        });

        renderPtBoard();

        // 残りカードがある場合はモーダルを再描画し、無くなったら閉じる
        if (ptLookingCards && ptLookingCards.length > 0) {
            renderLookingCardsModal();
        } else {
            closePtModal();
            ptActiveRevealContext = null;
        }
    }
}
function ptProcessNextBatchMove() {
    if (!ptBatchMoveQueue || ptBatchMoveQueue.length === 0) {
        ptBatchMoveTargetZone = null;
        ptReturnToPreviousModal();
        return;
    }

    const cardId = ptBatchMoveQueue.shift();
    let card = null;

    if (ptActiveRevealContext === 'revealed') {
        let mIdx = ptRevealedMatchedCards.findIndex(c => c.id === cardId);
        if (mIdx !== -1) {
            card = ptRevealedMatchedCards.splice(mIdx, 1)[0];
        } else {
            let uIdx = ptRevealedUnmatchedCards.findIndex(c => c.id === cardId);
            if (uIdx !== -1) {
                card = ptRevealedUnmatchedCards.splice(uIdx, 1)[0];
            }
        }
        if (card) {
            ptState.deck.push(card);
        }
    } else if (ptActiveRevealContext === 'deck_view') {
        const found = ptState.deck.find(c => c.id === cardId);
        if (found) card = found;
    } else {
        const idx = ptLookingCards.findIndex(c => c.id === cardId);
        if (idx !== -1) {
            card = ptLookingCards.splice(idx, 1)[0];
            ptState.deck.push(card);
        }
    }

    if (!card) {
        ptProcessNextBatchMove();
        return;
    }

    if (ptBatchMoveTargetZone === 'shield') {
        ptOpenShieldDropSelectModal(cardId, 'deck');
    } else if (ptBatchMoveTargetZone === 'battle') {
        ptOpenBattlePlacementSelectModal(cardId, 'deck');
    }
}
function ptFindFirstFaceupCard(parentCard) {
    if (!parentCard) return null;
    if (!parentCard.faceDown) {
        return parentCard;
    }
    // 下敷きがある場合、上(配列の先頭)から順番に走査して表向きを探す
    if (parentCard.underCards && parentCard.underCards.length > 0) {
        for (let i = 0; i < parentCard.underCards.length; i++) {
            let found = ptFindFirstFaceupCard(parentCard.underCards[i]);
            if (found) return found;
        }
    }
    return null;
}

// 一括タップ処理の実行
function ptExecuteBatchTap() {
    selectedCards.forEach(id => {
        ['battle', 'mana'].forEach(zoneKey => {
            let card = ptState[zoneKey].find(c => c.id === id);
            if (card) {

}

// 一括アンタップ処理の実行
function ptExecuteBatchUntap() {
    selectedCards.forEach(id => {
        ['battle', 'mana'].forEach(zoneKey => {
            let card = ptState[zoneKey].find(c => c.id === id);
            if (card) {
                card.tapped = false;
            }
        });
    });
    selectedCards.clear();

}

// 一括封印処理の実行(バトルゾーンの選択カードのみ対象)
function ptExecuteBatchSeal() {
    // バトルゾーンにある選択カードを抽出
    const battleCardIds = [];
    selectedCards.forEach(id => {
        if (ptState.battle.some(c => c.id === id)) {
            battleCardIds.push(id);
        }
    });

    if (battleCardIds.length === 0) {
        alert("バトルゾーンのカードが選択されていません。");
        return;
    }

    if (ptState.deck.length < battleCardIds.length) {
        alert(`山札の残り枚数が足りません(必要枚数: ${battleCardIds.length}枚 / 残り: ${ptState.deck.length}枚)。`);
        return;
    }

    // 対象の各カードの上に山札から1枚ずつ裏向きに封印を重ねる
    battleCardIds.forEach(id => {
        let cardIndex = ptState.battle.findIndex(c => c.id === id);
        if (cardIndex !== -1) {
            let targetCard = ptState.battle[cardIndex];
            let deckCard = ptState.deck.pop();
            
            if (deckCard) {
                deckCard.faceDown = true; // 封印なので裏向き
                deckCard.tapped = targetCard.tapped; // 元のタップ状態を継承
                deckCard.inverted = false;
                deckCard.underCards = [];
                
                // 新しい封印カードを束の代表にし、元の構成をフラットに下にスタック
                const prevUnders = targetCard.underCards || [];
                targetCard.underCards = [];
                deckCard.underCards = [targetCard, ...prevUnders];
                
                ptState.battle[cardIndex] = deckCard;
            }
        }
    });

    selectedCards.clear();
    renderPtBoard();
}

// 単一の封印解除処理
function ptReleaseSeal(cardId, skipRender = false) {
    let index = ptState.battle.findIndex(c => c.id === cardId);
    if (index === -1) return;

    let card = ptState.battle[index];
    
    // 安全検証：裏向きかつ下に構成カードが存在しているか
    if (card.faceDown && card.underCards && card.underCards.length > 0) {
        // バトルゾーンから封印(一番上のカード)を切り離す
        ptState.battle.splice(index, 1);

        card.faceDown = false; // 墓地に置くため表向きに戻す
        const sealUnderCards = [card.underCards];
        card.underCards = []; // 参照クリア
        ptState.graveyard.push(card); // 封印カード本体を墓地へ

        // 下に残されていた本来のカード群をバトルゾーンに復元
        if (sealUnderCards.length > 0) {
            let nextParent = sealUnderCards[0];
            nextParent.underCards = sealUnderCards.slice(1);
            ptState.battle.splice(index, 0, nextParent);
        }

        if (!skipRender) {
            renderPtBoard();
        }
    }
}

// 一括封印解除処理
function ptExecuteBatchReleaseSeal() {
    selectedCards.forEach(id => {
        ptReleaseSeal(id, true); // 描画をスキップして高速処理
    });
    selectedCards.clear();
    renderPtBoard(); // 最後に一括して再描画
}
// 選択された配置モードに則り、シールドへの一括移動を実行
function ptExecuteBatchShieldPlacement(mode) {
    if (selectedCards.size === 0) {
        closePtModal();
        return;
    }

    let collectedCards = [];
    
    // 選択されたカードを元々のゾーンからすべて引き抜き、一旦フラットな配列として収集する
    selectedCards.forEach(id => {
        const from = findCardZone(id);
        if (from) {
            const idx = ptState[from].findIndex(c => c.id === id);
            if (idx !== -1) {
                let card = ptState[from].splice(idx, 1)[0];
                
                // 元々重ねられていた下敷きカード群(underCards)も分解を可能にするため一時的にフラット化
                let childUnderCards = card.underCards || [];
                card.underCards = [];
                
                collectedCards.push(card);
                childUnderCards.forEach(cu => {
                    collectedCards.push(cu);
                });
            }
        }
    });

    if (collectedCards.length > 0) {
        if (mode === 'bundle_facedown' || mode === 'bundle_faceup') {
            // A. 【まとめて重ねて置く】
            const isFaceDown = (mode === 'bundle_facedown');
            
            collectedCards.forEach(c => {
                c.faceDown = isFaceDown;
                c.tapped = false;
                c.inverted = false;
            });
            
            // 先頭の1枚を親(代表)にし、残りのカードをすべて underCards 配列に重ねる
            let parentCard = collectedCards.shift();
            parentCard.underCards = collectedCards;
            
            // サイキック/GRなどの特別帰還処理を含めつつ、シールドゾーンに追加
            if (!ptCheckAndReturnSpecialCard(parentCard, 'shield', { faceDown: isFaceDown })) {
                ptState.shield.push(parentCard);
            }
        } else {
            // B. 【すべて個別の新しいシールドとして置く】
            const isFaceDown = (mode === 'scatter_facedown');
            
            collectedCards.forEach(c => {
                if (ptCheckAndReturnSpecialCard(c, 'shield', { faceDown: isFaceDown })) {
                    return; // GR/サイキックカードは超GRや超次元に戻る
                }
                c.faceDown = isFaceDown;
                c.tapped = false;
                c.inverted = false;
                c.underCards = []; // 個別化するため、下敷き連動は完全リセット
                ptState.shield.push(c);
            });
        }
    }

    selectedCards.clear();
    closePtModal();
    renderPtBoard();
}

function ptExecuteDeckDrop(cardId, fromZone, action) {
    const card = findCardById(cardId); // ★ 移動前に対象カードの参照を取得
    const isPartnerBattle = (isDueParty && card && card.is_partner && fromZone === 'battle');

    if (action === 'top') {
        ptMoveCard(cardId, fromZone, 'deck', { skipPartnerCheck: isPartnerBattle });
    } else if (action === 'bottom') {
        ptMoveCard(cardId, fromZone, 'deck', { bottom: true, skipPartnerCheck: isPartnerBattle });
    } else if (action === 'shuffle') {
        ptMoveCard(cardId, fromZone, 'deck', { skipPartnerCheck: isPartnerBattle });
        ptShuffle(ptState.deck);
    }
    closePtModal();
    renderPtBoard();

    // ★ 追加: パートナーがバトルゾーンから山札へ送られた場合、帰還確認モーダルを開く
    if (isPartnerBattle) {
        ptOpenPartnerReturnChoiceModal(card, 'deck');
    }
}

function ptMoveGroupedViewerBatch(fromZone, targetZone) {

    let allIds = [];

    });

        allIds.forEach(id => {

        });
        if (action) {
            ptShuffle(ptState.deck);
        }
        closePtModal();
        renderPtBoard();
        return;
    }

    let anyModalOpened = false;
    allIds.forEach(id => {
        // バトルゾーンへの移動で、進化クリーチャーやオレガ・オーラの場合は専用の出し方処理へ
        if (targetZone === 'battle') {
            const card = ptState[fromZone] ? ptState[fromZone].find(c => c.id === id) : null;
            if (card) {
                const charIds = card.characteristics_ids || [];
                const isEvo = charIds.some(cid => [2, 9, 13, 16].includes(cid));
                const isAura = card.cardtype_ids && card.cardtype_ids.includes(8);
                if (isEvo || isAura) {
                    anyModalOpened = true;
                    closePtModal();
                    ptCheckEvolutionAndPlay(id, fromZone);
                    return;
                }
            }
        }
        // 通常のクリーチャー、またはシールド・手札・マナ等への直接移動
        ptMoveCard(id, fromZone, targetZone, { skipUnderCheck: true });
    });

    if (!anyModalOpened) {
        closePtModal();
    }
    renderPtBoard();
}
// ability_id: 184 超GRから裏向きで下に重ねて出す処理

function ptExecuteGrUnderPlay(cardId, fromZone, count) {
    let card = ptState[fromZone].find(c => c.id === cardId);
    if (!card) return;

    if (ptState.gr.length < count) {
        alert(`超GRの枚数が足りません。（指定: ${count}枚 / 残り: ${ptState.gr.length}枚）`);
        return;
    }

    // 本体を先にバトルゾーンへ移動
    ptMoveCard(cardId, fromZone, 'battle', { skipUnderCheck: true, skipDoubleSidedCheck: true });
    let playedCard = ptState.battle.find(c => c.id === cardId);
    if (!playedCard) {
        closePtModal();
        return;
    }

    // 超GRの上から指定枚数を裏向きで下に重ねる
    for (let i = 0; i < count; i++) {
        let grCard = ptState.gr.pop();
        if (grCard) {
            grCard.faceDown = true;
            grCard.tapped = false;
            grCard.inverted = false;
            grCard.is_under_stacked = true;
            playedCard.underCards.push(grCard);
        }
    }

    closePtModal();
    renderPtBoard();

    // シールド追加能力のチェック
    ptCheckShieldAddAbility(playedCard);
}
// ==========================================
// ability_id: 100 (指定種族捲り＆下重ね進化)
// race_id が 71 または 384、かつ characteristics_id に 2, 13, 14 を含まないカードが出るまで捲る
// ==========================================
let ptAb100MatchedCards = [];
let ptAb100UnmatchedCards = [];
let ptAb100PendingCardId = null;
let ptAb100PendingFromZone = null;

function ptExecuteAbility100(cardId, fromZone) {
    if (ptState.deck.length === 0) {
        alert("山札にカードがありません。");
        return;
    }

    ptAb100PendingCardId = cardId;
    ptAb100PendingFromZone = fromZone;
    ptAb100MatchedCards = [];
    ptAb100UnmatchedCards = [];

    while (ptState.deck.length > 0) {
        let c = ptState.deck.pop();
        c.faceDown = false;

        const rIds = c.race_ids || [];
        const chIds = c.characteristics_ids || [];

        const hasTargetRace = rIds.some(id => id === 71 || id === 384);
        const hasExcludedChar = chIds.some(id => [2, 13, 14].includes(id));

        if (hasTargetRace && !hasExcludedChar) {
            ptAb100MatchedCards.push(c);
            break; // 条件に合うカードが出た時点で終了
        } else {
            ptAb100UnmatchedCards.push(c);
        }
    }

    renderAbility100Modal();
}

function ptConfirmAbility100() {
    const selectedEl = document.querySelector('#ptAb100MatchedGrid .pt-grid-item.selected');
    if (!selectedEl) {
        alert("下に重ねるカードを選択してください。");
        return;
    }
    const underCardId = selectedEl.dataset.cardId;
    const underCard = ptAb100MatchedCards.find(c => c.id === underCardId);

    // 1. 合わなかったカードを山札へ戻してシャッフル
    ptAb100UnmatchedCards.forEach(c => {
        c.faceDown = true;
        ptState.deck.push(c);
    });
    ptShuffle(ptState.deck);

    // 2. 本体をバトルゾーンに出す
    ptMoveCard(ptAb100PendingCardId, ptAb100PendingFromZone, 'battle', { skipUnderCheck: true, skipDoubleSidedCheck: true });
    const playedCard = ptState.battle.find(c => c.id === ptAb100PendingCardId);

    // 3. 条件一致カードを下に重ねる
    if (playedCard && underCard) {
        underCard.faceDown = false;
        underCard.tapped = false;
        underCard.inverted = false;
        underCard.is_under_stacked = true;
        playedCard.underCards.push(underCard);
    }

    ptAb100MatchedCards = [];
    ptAb100UnmatchedCards = [];
    ptAb100PendingCardId = null;
    ptAb100PendingFromZone = null;

    closePtModal();
    renderPtBoard();
    if (playedCard) ptCheckShieldAddAbility(playedCard);
}

function ptConfirmAbility100NoMatch() {
    // 捲れたカードを全て山札に戻してシャッフル
    ptAb100UnmatchedCards.forEach(c => {
        c.faceDown = true;
        ptState.deck.push(c);
    });
    ptShuffle(ptState.deck);

    // 本体のみバトルゾーンに出す
    ptMoveCard(ptAb100PendingCardId, ptAb100PendingFromZone, 'battle', { skipUnderCheck: true, skipDoubleSidedCheck: true });
    const playedCard = ptState.battle.find(c => c.id === ptAb100PendingCardId);

    ptAb100MatchedCards = [];
    ptAb100UnmatchedCards = [];

    closePtModal();

function ptCancelAbility100() {
    // 捲ったカードを全て山札に戻してシャッフル
    [...ptAb100MatchedCards, ...ptAb100UnmatchedCards].forEach(c => {
        c.faceDown = true;

    ptShuffle(ptState.deck);

    ptAb100MatchedCards = [];
    ptAb100UnmatchedCards = [];
    ptAb100PendingCardId = null;
    ptAb100PendingFromZone = null;

    closePtModal();
    renderPtBoard();
}

function ptExecuteEvo361Stack(cardId, fromZone) {
    if (!pt361SelectedTarget) {
        alert("下に重ねるカードを選択するか、「重ねずに単体で出す」を選択してください。");
        return;
    }

    const targetId = pt361SelectedTarget.cardId;
    const targetZone = pt361SelectedTarget.zone;

    // バトルゾーンのカードがタップされていた場合の状態引継ぎ判定
    let shouldBeTapped = false;
    if (targetZone === 'battle') {
        const bCard = ptState.battle.find(c => c.id === targetId);
        if (bCard && bCard.tapped) shouldBeTapped = true;
    }

    // 本体をバトルゾーンへ
    ptMoveCard(cardId, fromZone, 'battle', { skipUnderCheck: true, skipDoubleSidedCheck: true });
    const playedCard = ptState.battle.find(c => c.id === cardId);
    if (!playedCard) {
        closePtModal();
        return;
    }

    if (shouldBeTapped) playedCard.tapped = true;

    // 重ねる対象カードを元のゾーンから引き抜いて下に重ねる
    const idx = ptState[targetZone].findIndex(c => c.id === targetId);
    if (idx !== -1) {
        const underCard = ptState[targetZone].splice(idx, 1)[0];
        underCard.is_under_stacked = true;
        underCard.faceDown = false;
        underCard.tapped = false;
        underCard.inverted = false;

        const childUnderCards = underCard.underCards || [];
        underCard.underCards = [];

        playedCard.underCards.push(underCard);
        childUnderCards.forEach(cu => {
            cu.is_under_stacked = true;
            playedCard.underCards.push(cu);
        });
    }

    pt361SelectedTarget = null;
    closePtModal();
    renderPtBoard();
    if (playedCard) {
        ptTriggerBattleEnter(playedCard);
    }
}

// ==========================================
// G・リンク関連 定数および方向・互換性判定ロジック
// ==========================================
const PT_GLINK_ALL_IDS = [17, 173, 197, 293, 294, 307, 308, 323, 364, 365];
const PT_GOD_RACE_IDS = [108, 109, 110, 355, 425, 439, 447];

// テキスト内の指定プレフィックス行から《》内のカード名を抽出
function ptExtractGLinkNamesByPrefix(text, prefix) {
    if (!text) return [];
    const lines = text.split('\n');
    const matchedNames = [];
    lines.forEach(line => {
        const trimmed = line.trim();
        if (!prefix || trimmed.includes(prefix)) {
            const matches = trimmed.match(/《(.*?)》/g) || [];
            matches.forEach(m => matchedNames.push(m.replace(/[《》]/g, '').trim()));
        }
    });
    return matchedNames;
}

function ptExtractGLinkNames(text) {
    return ptExtractGLinkNamesByPrefix(text, null);
}

// actualCardName（実際のカード名）が specifiedTarget（テキスト中の《》指定名）を含んでいるか判定
function ptCardMatchesGLinkTarget(actualCardName, specifiedTarget) {
    if (!actualCardName || !specifiedTarget) return false;
    // 《》内の文字列をそのまま含むものとリンク可能（例: 《邪神M・ロマノフ》は《極限邪神M・ロマノフ》に合致）
    return actualCardName.includes(specifiedTarget.trim());
}

// sourceText の中で、指定された相手カードに対応するリンク方向を抽出（「または」複合指定対応版）
function ptGetSpecificLinkDirection(sourceText, actualCardName) {
    if (!sourceText || !actualCardName) return null;

    // 注釈文（...）を除去
    const cleanText = sourceText.replace(/（[\s\S]*?）/g, '').replace(/\([\s\S]*?\)/g, '');

    // 読点「、」や改行、スラッシュで区切られた指定フレーズごとに走査
    const clauses = cleanText.split(/[、\n/]/);

    for (const clause of clauses) {
        // フレーズ内の方角（右/左/上/下）を取得
        const dirMatch = clause.match(/(右|左|上|下)[側横]/);
        if (!dirMatch) continue;

        const dirChar = dirMatch[1];

        // フレーズ内に含まれるすべての《カード名》を取得（「《A》または《B》の上側」等に対応）
        const nameMatches = clause.match(/《([^》]+)》/g) || [];
        for (const m of nameMatches) {
            const targetName = m.replace(/[《》]/g, '').trim();

            // 実際のカード名が《》内の文字列を含んでいるか判定
            if (ptCardMatchesGLinkTarget(actualCardName, targetName)) {
                if (dirChar === '右') return 'left';   // 相手の右横にリンク → 相手は自分の「左」
                if (dirChar === '左') return 'right';  // 相手の左横にリンク → 相手は自分の「右」
                if (dirChar === '上') return 'bottom'; // 相手の上側にリンク → 相手は自分の「下」
                if (dirChar === '下') return 'top';    // 相手の下側にリンク → 相手は自分の「上」
            }
        }
    }

    return null;
}

// 互換性維持のためのラッパー
function ptDetermineGLinkDirection(sourceText, targetName) {
    return ptGetSpecificLinkDirection(sourceText, targetName) || 'right';
}

// 2枚のカードがリンク可能かを厳密に判定（既存リンク方向の塞がりチェック完全対応版）
// 2枚のカードがリンク可能かを厳密に判定（部分一致・同名含むルール完全対応版）
function ptCheckGLinkCompatibility(cardA, cardB) {
    const abA = cardA.ability_ids || [];
    const abB = cardB.ability_ids || [];
    const neighborsA = cardA.link_neighbors || {};
    const neighborsB = cardB.link_neighbors || {};

    const isLeftG = (ab) => ab.includes(307) || ab.includes(308) || ab.includes(364);
    const isRightG = (ab) => ab.includes(293) || ab.includes(294) || ab.includes(365);
    const isCenterG = (ab) => ab.includes(173);

    // --- 1. 左G・リンク系統 ---
    if (isLeftG(abA)) {
        if (!neighborsA.right && !neighborsB.left) {
            if (isRightG(abB) || isCenterG(abB)) {
                return 'right';
            }
        }
        if (abA.includes(308) || abA.includes(364)) {
            const targets = [
                ...ptExtractGLinkNamesByPrefix(cardA.text, '左G・リンクOMG'),
                ...ptExtractGLinkNamesByPrefix(cardA.text, '左G・リンク・ガルド')
            ];
            const hasMatchedName = targets.some(t => ptCardMatchesGLinkTarget(cardB.name, t));
            if (hasMatchedName && (abB.includes(17) || abB.includes(293) || abB.includes(294) || abB.includes(197))) {
                const dir = ptGetSpecificLinkDirection(cardA.text, cardB.name);
                if (dir === 'right' && !neighborsA.right && !neighborsB.left) return 'right';
                if (dir === 'left' && !neighborsA.left && !neighborsB.right) return 'left';
                if (dir === 'bottom' && !neighborsA.bottom && !neighborsB.top) return 'bottom';
                if (dir === 'top' && !neighborsA.top && !neighborsB.bottom) return 'top';
            }
        }
    }

    // --- 2. 右G・リンク系統 ---
    if (isRightG(abA)) {
        if (!neighborsA.left && !neighborsB.right) {
            if (isLeftG(abB) || isCenterG(abB)) {
                return 'left';
            }
        }
        if (abA.includes(294) || abA.includes(365)) {
            const targets = [
                ...ptExtractGLinkNamesByPrefix(cardA.text, '右G・リンクOMG'),
                ...ptExtractGLinkNamesByPrefix(cardA.text, '右G・リンク・ガルド')
            ];
            const hasMatchedName = targets.some(t => ptCardMatchesGLinkTarget(cardB.name, t));
            if (hasMatchedName && (abB.includes(17) || abB.includes(307) || abB.includes(308) || abB.includes(197))) {
                const dir = ptGetSpecificLinkDirection(cardA.text, cardB.name);
                if (dir === 'left' && !neighborsA.left && !neighborsB.right) return 'left';
                if (dir === 'right' && !neighborsA.right && !neighborsB.left) return 'right';
                if (dir === 'bottom' && !neighborsA.bottom && !neighborsB.top) return 'bottom';
                if (dir === 'top' && !neighborsA.top && !neighborsB.bottom) return 'top';
            }
        }
    }

    // --- 3. 中央G・リンク ---
    if (isCenterG(abA)) {
        if (isLeftG(abB) && !neighborsA.left && !neighborsB.right) return 'left';
        if (isRightG(abB) && !neighborsA.right && !neighborsB.left) return 'right';
    }

    // --- 4. トライ・G・リンク (197) ---
    if (abA.includes(197)) {
        const targets = ptExtractGLinkNamesByPrefix(cardA.text, 'トライ・G・リンク');
        const hasMatchedName = targets.some(t => ptCardMatchesGLinkTarget(cardB.name, t));
        if (hasMatchedName) {
            const validTargetAb = abB.some(id => [17, 293, 294, 307, 308].includes(id));
            if (validTargetAb) {
                const dir = ptGetSpecificLinkDirection(cardA.text, cardB.name);
                if (dir === 'right' && !neighborsA.right && !neighborsB.left) return 'right';
                if (dir === 'left' && !neighborsA.left && !neighborsB.right) return 'left';
                if (dir === 'top' && !neighborsA.top && !neighborsB.bottom) return 'top';
                if (dir === 'bottom' && !neighborsA.bottom && !neighborsB.top) return 'bottom';
            }
        }
    }

    // --- 5. 通常の G・リンク (17) 相互指定 ---
    if (abA.includes(17)) {
        const targetsA = ptExtractGLinkNames(cardA.text);
        const targetsB = ptExtractGLinkNames(cardB.text);
        const aMatchesB = targetsA.some(t => ptCardMatchesGLinkTarget(cardB.name, t));
        const bMatchesA = targetsB.some(t => ptCardMatchesGLinkTarget(cardA.name, t));

        // ★ 修正: どちらか片方のテキストに相手名と方向が書かれていればリンク可能とする
        if (aMatchesB || bMatchesA) {
            let dir = aMatchesB ? ptGetSpecificLinkDirection(cardA.text, cardB.name) : null;
            if (!dir && bMatchesA) {
                // B側にしか書かれていない場合、Bから見た向きを反転してAから見た向きに変換
                const dirFromB = ptGetSpecificLinkDirection(cardB.text, cardA.name);
                if (dirFromB === 'left') dir = 'right';
                else if (dirFromB === 'right') dir = 'left';
                else if (dirFromB === 'top') dir = 'bottom';
                else if (dirFromB === 'bottom') dir = 'top';
            }
            if (!dir) return null;

            if (dir === 'right' && !neighborsA.right && !neighborsB.left) return 'right';
            if (dir === 'left' && !neighborsA.left && !neighborsB.right) return 'left';
            if (dir === 'top' && !neighborsA.top && !neighborsB.bottom) return 'top';
            if (dir === 'bottom' && !neighborsA.bottom && !neighborsB.top) return 'bottom';
        }
    }

    return null;
}

// 連結しているグループ全体を再帰的に取得
function ptGetLinkedGroup(startCard) {
    const group = [];
    const queue = [startCard];
    const visited = new Set([startCard.id]);

    while (queue.length > 0) {
        const curr = queue.shift();
        group.push(curr);
        if (curr.linked_ids) {
            curr.linked_ids.forEach(id => {
                if (!visited.has(id)) {
                    visited.add(id);
                    const neighbor = ptState.battle.find(b => b.id === id);
                    if (neighbor) queue.push(neighbor);
                }
            });
        }
    }
    return group;
}
// 2枚のカードのG・リンク結合を適用
function ptApplyGLinkPair(cardA, cardB, dir) {
    cardA.linked_ids = cardA.linked_ids || [];
    cardB.linked_ids = cardB.linked_ids || [];
    if (!cardA.linked_ids.includes(cardB.id)) cardA.linked_ids.push(cardB.id);
    if (!cardB.linked_ids.includes(cardA.id)) cardB.linked_ids.push(cardA.id);

    cardA.link_neighbors = cardA.link_neighbors || {};
    cardB.link_neighbors = cardB.link_neighbors || {};

    if (dir === 'right') { 
        cardB.link_neighbors.left = cardA.id; 
        cardA.link_neighbors.right = cardB.id; 
    } else if (dir === 'left') { 
        cardB.link_neighbors.right = cardA.id; 
        cardA.link_neighbors.left = cardB.id; 
    } else if (dir === 'top') { 
        cardB.link_neighbors.bottom = cardA.id; 
        cardA.link_neighbors.top = cardB.id; 
    } else if (dir === 'bottom') { 
        cardB.link_neighbors.top = cardA.id; 
        cardA.link_neighbors.bottom = cardB.id; 
    }

    // タップ状態をグループ全体で同期（1枚でもタップされていれば全体タップ）
    const group = ptGetLinkedGroup(cardA);
    const anyTapped = group.some(c => c.tapped);
    group.forEach(c => c.tapped = anyTapped);
}
// リンクグループ内の未接続な隣接ペアを自動補完（バグ修正版: return -> continue）
function ptCloseGroupLoopLinks(startCard) {
    const group = ptGetLinkedGroup(startCard);
    if (group.length < 2) return;

    let changed = true;
    while (changed) {
        changed = false;
        for (let i = 0; i < group.length; i++) {
            const cardA = group[i];
            for (let j = 0; j < group.length; j++) {
                if (i === j) continue; // ★ 修正: return ではなく continue
                const cardB = group[j];

                const isAlreadyLinked = Object.values(cardA.link_neighbors || {}).includes(cardB.id);
                if (!isAlreadyLinked) {
                    const dir = ptCheckGLinkCompatibility(cardA, cardB);
                    if (dir) {
                        const neighborsA = cardA.link_neighbors || {};
                        const neighborsB = cardB.link_neighbors || {};
                        const canConnect = (dir === 'right' && !neighborsA.right && !neighborsB.left) ||
                                           (dir === 'left' && !neighborsA.left && !neighborsB.right) ||
                                           (dir === 'top' && !neighborsA.top && !neighborsB.bottom) ||
                                           (dir === 'bottom' && !neighborsA.bottom && !neighborsB.top);
                        if (canConnect) {
                            ptApplyGLinkPair(cardA, cardB, dir);
                            changed = true;
                        }
                    }
                }
            }
        }
    }
}
// 中央G・リンクが左Gと右Gの間に割り込む結合処理
function ptApplyGLinkBetween(centerCard, leftCard, rightCard) {
    if (leftCard.linked_ids) leftCard.linked_ids = leftCard.linked_ids.filter(id => id !== rightCard.id);
    if (rightCard.linked_ids) rightCard.linked_ids = rightCard.linked_ids.filter(id => id !== leftCard.id);
    if (leftCard.link_neighbors) delete leftCard.link_neighbors.right;
    if (rightCard.link_neighbors) delete rightCard.link_neighbors.left;

    ptApplyGLinkPair(centerCard, leftCard, 'left');
    ptApplyGLinkPair(centerCard, rightCard, 'right');
}
// リンクグループ全体の相対座標マップ { cardId: {x, y} } を計算するヘルパー
function ptCalculateGroupCoordinates(group) {
    if (!group || group.length === 0) return {};
    const coords = {};
    const startCard = group[0];
    coords[startCard.id] = { x: 0, y: 0 };
    const queue = [startCard];
    const visited = new Set([startCard.id]);

    while (queue.length > 0) {
        const curr = queue.shift();
        const curPos = coords[curr.id];
        const n = curr.link_neighbors || {};

        const checkAndQueue = (neighborId, dx, dy) => {
            if (neighborId && !visited.has(neighborId)) {
                visited.add(neighborId);
                coords[neighborId] = { x: curPos.x + dx, y: curPos.y + dy };
                const nextCard = group.find(c => c.id === neighborId);
                if (nextCard) queue.push(nextCard);
            }
        };

        checkAndQueue(n.left, -1, 0);
        checkAndQueue(n.right, 1, 0);
        checkAndQueue(n.top, 0, -1);
        checkAndQueue(n.bottom, 0, 1);
    }
    return coords;
}

// 特定カードのリンク可能な相手候補をすべてリストアップ（グリッド空間重複完全防止版）
function ptFindGLinkCandidatesForCard(cardA, battleCards) {
    const abA = cardA.ability_ids || [];
    if (!abA.some(id => PT_GLINK_ALL_IDS.includes(id))) return [];

    const candidates = [];
    const groupA = ptGetLinkedGroup(cardA);
    const groupAIds = new Set(groupA.map(c => c.id));

    // 中央G・リンクが既存の「左G」と「右G」の中央に割り込む特殊チェック
    if (abA.includes(173)) {
        const isLeftG = (ab) => ab.includes(307) || ab.includes(308) || ab.includes(364);
        const isRightG = (ab) => ab.includes(293) || ab.includes(294) || ab.includes(365);
        for (let j = 0; j < battleCards.length; j++) {
            const cardL = battleCards[j];
            if (!isLeftG(cardL.ability_ids || [])) continue;
            const rId = cardL.link_neighbors ? cardL.link_neighbors.right : null;
            if (!rId) continue;
            const cardR = battleCards.find(c => c.id === rId);
            if (cardR && isRightG(cardR.ability_ids || []) && !groupAIds.has(cardL.id) && !groupAIds.has(cardR.id)) {
                candidates.push({
                    targetCard: cardL,
                    partnerRightCard: cardR,
                    direction: 'between',
                    displayLabel: `《${cardL.name}》と《${cardR.name}》の中央にリンク`
                });
            }
        }
    }

    for (let j = 0; j < battleCards.length; j++) {
        const cardB = battleCards[j];
        if (cardA.id === cardB.id || groupAIds.has(cardB.id)) continue;

        const dir = ptCheckGLinkCompatibility(cardA, cardB);
        if (!dir) continue;

        // ★ 幾何学的グリッド空間チェック:
        // cardBの属するグループの全座標を算出し、cardAが配置される予定のマスにすでにカードが存在しないか検証
        const groupB = ptGetLinkedGroup(cardB);
        const coordsB = ptCalculateGroupCoordinates(groupB);
        const bPos = coordsB[cardB.id] || { x: 0, y: 0 };

        // dirは「cardAから見たcardBの方向」なので、cardBから見たcardAの相対変位(dx, dy)を求める
        let dx = 0, dy = 0;
        if (dir === 'left') dx = 1;        // cardAの左がcardB → cardBの右(+1)にcardA
        else if (dir === 'right') dx = -1; // cardAの右がcardB → cardBの左(-1)にcardA
        else if (dir === 'top') dy = 1;    // cardAの上がcardB → cardBの下(+1)にcardA
        else if (dir === 'bottom') dy = -1;// cardAの下がcardB → cardBの上(-1)にcardA

        const targetX = bPos.x + dx;
        const targetY = bPos.y + dy;

        // 予定座標(targetX, targetY)にすでにgroupBのカードが存在している場合は絶対にリンク不可
        const isSlotOccupied = groupB.some(member => {
            const mPos = coordsB[member.id] || { x: 0, y: 0 };
            return mPos.x === targetX && mPos.y === targetY;
        });

        if (!isSlotOccupied) {
            candidates.push({ targetCard: cardB, direction: dir });
        }
    }
    return candidates;
}


// 中央G・リンクが左Gと右Gの間に割り込む結合処理
function ptApplyGLinkBetween(centerCard, leftCard, rightCard) {
    if (leftCard.linked_ids) leftCard.linked_ids = leftCard.linked_ids.filter(id => id !== rightCard.id);
    if (rightCard.linked_ids) rightCard.linked_ids = rightCard.linked_ids.filter(id => id !== leftCard.id);
    if (leftCard.link_neighbors) delete leftCard.link_neighbors.right;
    if (rightCard.link_neighbors) delete rightCard.link_neighbors.left;

    ptApplyGLinkPair(centerCard, leftCard, 'left');
    ptApplyGLinkPair(centerCard, rightCard, 'right');
}

// バトルゾーン内の自動リンク走査（左G・右Gは勝手に自動リンクしない）
function ptAutoLinkBattleZone() {
    // 任意選択である左G(307,308,364)・右G(293,294,365)・中央G(173)単体は自動走査から除外
    const battleCards = ptState.battle.filter(c => !c.faceDown && c.ability_ids && (c.ability_ids.includes(17) || c.ability_ids.includes(197)));
    if (battleCards.length < 2) return false;

    // 環状リンクの隙間を埋める内部ヘルパー
    const closeLoopLinks = () => {
        let closedAny = false;
        ptState.battle.filter(c => !c.faceDown).forEach(cA => {
            const group = ptGetLinkedGroup(cA);
            if (group.length < 3) return;

            group.forEach(cB => {
                if (cA.id === cB.id) return;
                const isAlreadyDirectNeighbor = Object.values(cA.link_neighbors || {}).includes(cB.id);
                if (!isAlreadyDirectNeighbor) {
                    const dir = ptCheckGLinkCompatibility(cA, cB);
                    if (dir) {
                        ptApplyGLinkPair(cA, cB, dir);
                        closedAny = true;
                    }
                }
            });
        });
        return closedAny;
    };

    closeLoopLinks();

    const canLinkAllSimultaneously = (cands) => {
        if (!cands || cands.length < 2) return false;
        const dirs = cands.map(c => c.direction);
        if (new Set(dirs).size !== dirs.length || dirs.includes('between')) return false;

        for (const cand of cands) {
            const partnerCands = ptFindGLinkCandidatesForCard(cand.targetCard, ptState.battle);
            const partnerDirs = partnerCands.map(pc => pc.direction);
            if (new Set(partnerDirs).size !== partnerDirs.length || partnerDirs.includes('between')) {
                return false;
            }
        }
        return true;
    };

    for (let i = 0; i < battleCards.length; i++) {
        const cardA = battleCards[i];
        const candidatesA = ptFindGLinkCandidatesForCard(cardA, ptState.battle);
        if (candidatesA.length === 0) continue;

        if (canLinkAllSimultaneously(candidatesA)) {
            candidatesA.forEach(cand => {
                ptApplyGLinkPair(cardA, cand.targetCard, cand.direction);
            });
            closeLoopLinks();
            return true;
        }

        if (candidatesA.length === 1) {
            const cand = candidatesA[0];
            const cardB = cand.targetCard;
            const candidatesB = ptFindGLinkCandidatesForCard(cardB, ptState.battle);

            if (canLinkAllSimultaneously(candidatesB)) {
                candidatesB.forEach(cB => {
                    ptApplyGLinkPair(cardB, cB.targetCard, cB.direction);
                });
                closeLoopLinks();
                return true;
            }

            if (candidatesB.length > 1) {
                ptOpenGLinkChoiceSelectorModal(cardB, candidatesB);
                return false;
            }

            if (cand.direction === 'between') {
                ptOpenGLinkChoiceSelectorModal(cardA, candidatesA);
                return false;
            }

            ptApplyGLinkPair(cardA, cardB, cand.direction);
            closeLoopLinks();
            return true;
        }

        if (candidatesA.length > 1) {
            ptOpenGLinkChoiceSelectorModal(cardA, candidatesA);
            return false;
        }
    }
    return false;
}

// G・リンク選択モーダル（コールバック連携対応版）
function ptOpenGLinkChoiceSelectorModal(sourceCard, candidates, onComplete = null) {
    const modal = document.getElementById('ptListModal');
    const title = document.getElementById('ptModalTitle');
    const body = document.getElementById('ptModalBody');
    const footer = document.getElementById('ptModalFooter');

    title.innerText = "G・リンク先の選択";

    const dirText = (cand) => {
        if (cand.displayLabel) return cand.displayLabel;
        const d = cand.direction;
        if (d === 'right') return `《${cand.targetCard.name}》の【左横】にリンク`;
        if (d === 'left') return `《${cand.targetCard.name}》の【右横】にリンク`;
        if (d === 'top') return `《${cand.targetCard.name}》の【下側】にリンク`;
        if (d === 'bottom') return `《${cand.targetCard.name}》の【上側】にリンク`;
        return `《${cand.targetCard.name}》にリンク`;
    };

    body.innerHTML = `
        <p style="margin-bottom:12px; font-size:13px; color:#aaa; text-align:center;">
            「<strong>${sourceCard.name}</strong>」のリンク先を選択してください。
        </p>
        <div class="pt-grid" id="ptGLinkChoiceGrid"></div>
    `;

    const grid = document.getElementById('ptGLinkChoiceGrid');
    candidates.forEach(cand => {
        const itemEl = document.createElement('div');
        itemEl.className = 'pt-grid-item';
        itemEl.innerHTML = `
            <img src="${cand.targetCard.src}">
            <div class="card-qty" style="font-weight:bold; color:#fff; margin-top:4px;">${cand.targetCard.name}</div>
            <div style="font-size:10px; color:#ffc107; margin-top:2px;">${dirText(cand)}</div>
        `;
        itemEl.onclick = () => {
            closePtModal();
            if (cand.direction === 'between') {
                ptApplyGLinkBetween(sourceCard, cand.targetCard, cand.partnerRightCard);
            } else {
                ptApplyGLinkPair(sourceCard, cand.targetCard, cand.direction);
            }
            ptCloseGroupLoopLinks(sourceCard);
            renderPtBoard();

            // リンク完了後に後続処理（中央G・リンクモーダルなど）を実行
            if (onComplete) {
                setTimeout(onComplete, 120);
            }
        };
        grid.appendChild(itemEl);
    });

    footer.innerHTML = `
        <button class="btn-pt-secondary" id="btnPtSkipGeneralGLink">今はリンクしない</button>
    `;

    document.getElementById('btnPtSkipGeneralGLink').onclick = () => {
        closePtModal();
        if (onComplete) {
            setTimeout(onComplete, 60);
        }
    };

    modal.style.display = 'flex';
}

// 中央G・リンク キュー管理（複数枚対応・安全移行版）
// ========================================================
let ptCenterGQueue = [];

// 次の中央G・リンクモーダルへ進む共通処理
function ptFinishCurrentCenterGAndNext() {
    closePtModal();
    renderPtBoard();
    if (ptCenterGQueue && ptCenterGQueue.length > 0) {
        setTimeout(ptProcessNextCenterGModal, 150);
    }
}

function ptProcessNextCenterGModal() {
    if (!ptCenterGQueue || ptCenterGQueue.length === 0) {
        ptCenterGQueue = [];
        closePtModal();
        return;
    }

    const targetCenter = ptCenterGQueue.shift();
    if (!targetCenter) {
        ptProcessNextCenterGModal();
        return;
    }

    const ab = targetCenter.ability_ids || [];
    const is360 = ab.some(id => Number(id) === 323);
    const hasAnyLinkedCard = ptState.battle.some(c => !c.faceDown && c.linked_ids && c.linked_ids.length > 0);

    setTimeout(() => {
        if (is360) {
            ptOpenCenter360UnlinkModal(targetCenter);
        } else {
            if (hasAnyLinkedCard) {
                ptOpenUnlinkStepModal(targetCenter);
            } else {
                ptOpenCenterGLinkSelectModal(targetCenter);
            }
        }
    }, 80);
}

// G・リンク管理ハブ（画像・カード名一覧から自由な順序で処理）
// ========================================================
let ptGLinkHubActions = [];
let ptCurrentRunningActionId = null;

// アクション完了時にリストから削除して次へ進む共通処理
function ptRemoveHubActionAndReturn(actionId) {
    if (actionId) {
        ptGLinkHubActions = ptGLinkHubActions.filter(a => a.id !== actionId);
    }
    ptCurrentRunningActionId = null;
    renderPtBoard();

    if (ptGLinkHubActions.length === 0) {
        // すべて完了したらモーダルを閉じて終了
        closePtModal();
    } else if (ptGLinkHubActions.length === 1) {
        // 残り1件になった場合は選択画面を挟まず即時実行
        ptDispatchGLinkAction(ptGLinkHubActions[0]);
    } else {
        // 2件以上残っている場合はハブ一覧を再描画
        ptOpenGLinkHubModal();
    }
}

// バトルゾーンに出た時の能力・リンク統合処理（リンク先不在時のモーダル抑止版）
function ptTriggerBattleEnter(card) {
    if (!card || card.faceDown) return;

    ptCheckShieldAddAbility(card);

    const ab = card.ability_ids || [];
    const races = card.race_ids || [];
    const isCenterG = ab.some(id => Number(id) === 173);
    const isCenterG360 = ab.some(id => Number(id) === 323);
    const isGod = races.some(r => PT_GOD_RACE_IDS.includes(Number(r)));
    const hasGLink = ab.some(id => PT_GLINK_ALL_IDS.includes(Number(id)));

    // ★ 外せるリンクが既に存在するか
    const hasLinkedCardsInBattle = ptState.battle.some(c => !c.faceDown && c.linked_ids && c.linked_ids.length > 0);

    // ★ 中央G・リンク（173）に接続可能な相手が1体でもいるか判定
    const hasCenterGPartners = (center) => {
        if (hasLinkedCardsInBattle) return true; // 外せるリンクが存在する場合は表示
        return ptState.battle.some(c => {
            if (c.faceDown || c.id === center.id) return false;
            const cAb = c.ability_ids || [];
            const canLeft = cAb.some(id => [307, 308, 364].includes(Number(id))) || ptGetSpecificLinkDirection(c.text, center.name) === 'right';
            const canRight = cAb.some(id => [293, 294, 365].includes(Number(id))) || ptGetSpecificLinkDirection(c.text, center.name) === 'left';
            return canLeft || canRight;
        });
    };

    // ★ 中央G・リンク360（323）に接続可能な相手が1体でもいるか判定
    const hasCenter360Partners = (center) => {
        if (hasLinkedCardsInBattle) return true; // 外せるリンクが存在する場合は表示
        return ptState.battle.some(c => 
            !c.faceDown && c.id !== center.id && c.ability_ids && 
            c.ability_ids.some(id => PT_GLINK_ALL_IDS.includes(Number(id)))
        );
    };

    ptGLinkHubActions = [];

    // 1. 出たカード自身の通常G・リンク候補
    if (hasGLink && !isCenterG && !isCenterG360) {
        const nonCenterBattleCards = ptState.battle.filter(c => !(c.ability_ids && c.ability_ids.some(id => Number(id) === 173 || Number(id) === 323)));
        const generalCandidates = ptFindGLinkCandidatesForCard(card, nonCenterBattleCards);
        if (generalCandidates.length > 0) {
            ptGLinkHubActions.push({
                id: 'general_' + card.id,
                type: 'general',
                card: card,
                candidates: generalCandidates,
                label: '通常G・リンク'
            });
        }
    }

    // 2. 出たカード自身の中央G・リンク（リンク先・解除先がいる場合のみ追加）
    if (isCenterG && hasCenterGPartners(card)) {
        ptGLinkHubActions.push({ id: 'center_' + card.id, type: 'center', card: card, label: '中央G・リンク編成' });
    } else if (isCenterG360 && hasCenter360Partners(card)) {
        ptGLinkHubActions.push({ id: 'center360_' + card.id, type: 'center360', card: card, label: '中央G・リンク360編成' });
    }

    // 3. バトルゾーンに存在する他の中央G・リンク群（リンク先・解除先がいる場合のみ追加）
    if (isGod || hasGLink) {
        const otherCenters = ptState.battle.filter(c => 
            !c.faceDown && c.id !== card.id && c.ability_ids && 
            c.ability_ids.some(id => Number(id) === 173 || Number(id) === 323)
        );
        otherCenters.forEach(cc => {
            const ccAb = cc.ability_ids || [];
            const is360 = ccAb.some(id => Number(id) === 323);
            if (is360 && hasCenter360Partners(cc)) {
                ptGLinkHubActions.push({
                    id: 'center360_' + cc.id,
                    type: 'center360',
                    card: cc,
                    label: '中央G・リンク360編成'
                });
            } else if (!is360 && hasCenterGPartners(cc)) {
                ptGLinkHubActions.push({
                    id: 'center_' + cc.id,
                    type: 'center',
                    card: cc,
                    label: '中央G・リンク編成'
                });
            }
        });
    }

    // 処理対象が1件のみなら即時実行、複数あればハブモーダルを表示（0件なら何もしない）
    if (ptGLinkHubActions.length === 1) {
        setTimeout(() => {
            ptDispatchGLinkAction(ptGLinkHubActions[0]);
        }, 100);
    } else if (ptGLinkHubActions.length > 1) {
        setTimeout(ptOpenGLinkHubModal, 100);
    }
}

// 選択されたアクションを実行（完了・キャンセル時はハブへ復帰）
function ptDispatchGLinkAction(action) {
    ptCurrentRunningActionId = action.id;

    if (action.type === 'general') {
        ptOpenGLinkChoiceSelectorModal(action.card, action.candidates, () => {
            ptRemoveHubActionAndReturn(action.id);
        });
    } else if (action.type === 'center') {
        const hasLinked = ptState.battle.some(c => !c.faceDown && c.linked_ids && c.linked_ids.length > 0);
        if (hasLinked) {

function ptExecuteUnlinkStep(centerId, unlinkMode) {
    const centerCard = ptState.battle.find(c => c.id === centerId);

    if (unlinkMode === true) {
        // 全解除
        ptState.battle.forEach(c => {
            c.linked_ids = [];
            c.link_neighbors = {};
        });
    } else if (unlinkMode === 'selected' && ptCardsToUnlinkIds.length > 0) {
        // 選択されたカードのみリンク解除
        ptCardsToUnlinkIds.forEach(id => {
            const card = ptState.battle.find(c => c.id === id);
            if (card) {
                (card.linked_ids || []).forEach(partnerId => {
                    const p = ptState.battle.find(b => b.id === partnerId);
                    if (p) {
                        p.linked_ids = (p.linked_ids || []).filter(lid => lid !== card.id);
                        if (p.link_neighbors) {
                            for (const dir in p.link_neighbors) {
                                if (p.link_neighbors[dir] === card.id) delete p.link_neighbors[dir];
                            }
                        }
                    }
                });
                card.linked_ids = [];
                card.link_neighbors = {};
            }
        });
    }

    renderPtBoard();
    if (centerCard) {
        ptOpenCenterGLinkSelectModal(centerCard);
    } else {
        closePtModal();
    }
}

function ptConfirmCenterGLink() {
    if (!ptCenterGTarget) {
        ptRemoveHubActionAndReturn(ptCurrentRunningActionId);
        return;
    }
    const centerCard = ptCenterGTarget;
    const leftId = ptCenterGChosenLeftId;
    const rightId = ptCenterGChosenRightId;

    if (leftId) {
        const leftCard = ptState.battle.find(c => c.id === leftId);
        if (leftCard) ptApplyGLinkPair(centerCard, leftCard, 'left');
    }
    if (rightId) {
        const rightCard = ptState.battle.find(c => c.id === rightId);
        if (rightCard) ptApplyGLinkPair(centerCard, rightCard, 'right');
    }

    ptCloseGroupLoopLinks(centerCard);
    // ★ 処理完了として削除し次へ
    ptRemoveHubActionAndReturn(ptCurrentRunningActionId);
}
function ptExecuteCenterGLink(centerId, leftId, rightId) {
    const centerCard = ptState.battle.find(c => c.id === centerId);
    if (!centerCard) {
        closePtModal();
        return;
    }

    if (leftId) {
        const leftCard = ptState.battle.find(c => c.id === leftId);
        if (leftCard) {
            ptApplyGLinkPair(centerCard, leftCard, 'left');
        }
    }
    if (rightId) {
        const rightCard = ptState.battle.find(c => c.id === rightId);
        if (rightCard) {
            ptApplyGLinkPair(centerCard, rightCard, 'right');
        }
    }

    ptCloseGroupLoopLinks(centerCard);
    closePtModal();
    renderPtBoard();
    // ★ 追加: 次の中央G・リンクがあれば続けて処理
    setTimeout(ptProcessNextCenterGModal, 120);
}

    const isCenterG = ab.includes(173);

    } else {

    }
}

    };

                <h4 style="margin:0 0 4px 0; color:#007bff; font-size:12px;">【左側にリンク】</h4>
                <div class="pt-grid" id="pt360GridLeft"></div>
            </div>

                <h4 style="margin:0 0 4px 0; color:#28a745; font-size:12px;">【右側にリンク】</h4>
                <div class="pt-grid" id="pt360GridRight"></div>
            </div>
        </div>
    `;

    const candidates = ptState.battle.filter(c => !c.faceDown && c.id !== centerCard.id && c.ability_ids && c.ability_ids.some(id => PT_GLINK_ALL_IDS.includes(id)));

    // 方向適性の判定
    const getCompatibleDirs = (c) => {
        const ab = c.ability_ids || [];
        const dirs = [];
        const specificDir = ptGetSpecificLinkDirection(c.text, centerCard.name);

        if (specificDir) {
            // specificDirはcから見た向きなので、centerCardから見た配置方向に変換
            if (specificDir === 'bottom') dirs.push('top');
            if (specificDir === 'top') dirs.push('bottom');
            if (specificDir === 'right') dirs.push('left');
            if (specificDir === 'left') dirs.push('right');
            return dirs;
        }

        if (ab.includes(307) || ab.includes(308) || ab.includes(364)) dirs.push('left');
        if (ab.includes(293) || ab.includes(294) || ab.includes(365)) dirs.push('right');

        // 方向指定がない一般G・リンクは360全方向に配置可能
        if (dirs.length === 0) {
            dirs.push('top', 'bottom', 'left', 'right');

        return dirs;
    };

    const renderDirectionGrids = () => {
        ['top', 'bottom', 'left', 'right'].forEach(dir => {

            candidates.forEach(c => {
                if (!getCompatibleDirs(c).includes(dir)) return;

                const isSelected = ptCenter360ChosenSlots[dir] === c.id;

                        }
                        ptCenter360ChosenSlots[dir] = c.id;
                    }
                    renderDirectionGrids();
                };
                gridEl.appendChild(itemEl);
            });
        });
    };

    renderDirectionGrids();

    footer.innerHTML = `
        <button class="btn-pt-secondary" onclick="ptOpenGLinkHubModal()">戻る</button>
        <button class="btn-pt-primary" onclick="ptConfirmCenter360Link()">リンクを決定</button>

function ptConfirmCenter360Link() {
    if (!ptCenter360Target) {
        ptRemoveHubActionAndReturn(ptCurrentRunningActionId);
        return;
    }
    const centerCard = ptCenter360Target;

    ['top', 'bottom', 'left', 'right'].forEach(dir => {
        const targetId = ptCenter360ChosenSlots[dir];
        if (targetId) {
            const partnerCard = ptState.battle.find(c => c.id === targetId);
            if (partnerCard) ptApplyGLinkPair(centerCard, partnerCard, dir);
        }
    });

    ptCloseGroupLoopLinks(centerCard);
    // ★ 処理完了として削除し次へ
    ptRemoveHubActionAndReturn(ptCurrentRunningActionId);
}
</script>
